name: Validate #5544 candidate

on:
  push:
    branches:
      - fix/org-details-invalid-query-params-5544

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install -r requirements.dev.txt
          scripts/lint.sh

      - name: Targeted org_details tests
        run: >-
          docker compose run --rm test /bin/bash -lc
          './scripts/docker_setup.sh && cd openprescribing &&
          python manage.py test
          frontend.tests.test_api_org_details
          frontend.tests.test_api_org_details_query_params'

      - name: Full non-functional and production-image tests
        run: >-
          docker compose run --service-ports test &&
          docker compose run --service-ports test-production
        env:
          TEST_SUITE: nonfunctional

      - name: Clean up
        if: always()
        run: docker compose down --volumes
