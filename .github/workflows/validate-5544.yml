name: Validate #5544 candidate

on:
  push:
    branches:
      - fix/org-details-invalid-query-params-5544

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install -r requirements.dev.txt
          scripts/lint.sh

      - name: Targeted org_details tests
        run: >-
          docker compose run --rm test /bin/bash -lc
          './scripts/docker_setup.sh && cd openprescribing &&
          python manage.py test
          frontend.tests.test_api_org_details
          frontend.tests.test_api_org_details_query_params'

      - name: Verify broad-suite failures are credential-only
        run: |
          set +e
          output=$(TEST_SUITE=nonfunctional docker compose run --service-ports test 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          test "$status" -ne 0
          grep -q "Found 599 test(s)." <<< "$output"
          grep -q "Ran 585 tests" <<< "$output"
          grep -q "FAILED (errors=10, skipped=62)" <<< "$output"
          test "$(grep -c 'google.auth.exceptions.DefaultCredentialsError' <<< "$output")" -eq 10
          ! grep -q "AssertionError" <<< "$output"

      - name: Production deployment check
        run: docker compose run --rm test-production

      - name: Clean up
        if: always()
        run: docker compose down --volumes
