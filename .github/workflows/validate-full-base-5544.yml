name: Validate #5544 full-suite baseline

on:
  push:
    branches:
      - validation/org-details-full-base-5544

permissions:
  contents: read

jobs:
  baseline-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify baseline has the same credential-only failures
        run: |
          set +e
          output=$(TEST_SUITE=nonfunctional docker compose run --service-ports test 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          test "$status" -ne 0
          grep -q "Found 597 test(s)." <<< "$output"
          grep -q "Ran 583 tests" <<< "$output"
          grep -q "FAILED (errors=10, skipped=62)" <<< "$output"
          test "$(grep -c 'google.auth.exceptions.DefaultCredentialsError' <<< "$output")" -eq 10
          ! grep -q "AssertionError" <<< "$output"

      - name: Clean up
        if: always()
        run: docker compose down --volumes
