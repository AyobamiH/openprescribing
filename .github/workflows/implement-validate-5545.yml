name: Implement and validate tariff query parameters

on:
  push:
    branches:
      - automation/implement-tariff-5545
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out clean feature branch
        run: |
          git checkout -B fix/tariff-invalid-query-params-5545 \
            origin/fix/tariff-invalid-query-params-5545

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply endpoint validation and regression coverage
        run: |
          python <<'PY'
          from pathlib import Path

          view_path = Path("openprescribing/api/views_spending.py")
          view_text = view_path.read_text()

          import_marker = "from . import view_utils as utils\n\n\nclass NotValid"
          import_replacement = (
              "from . import view_utils as utils\n\n\n"
              'ALLOWED_TARIFF_QUERY_PARAMS = {"codes", "format"}\n\n\n'
              "class NotValid"
          )
          assert view_text.count(import_marker) == 1
          view_text = view_text.replace(import_marker, import_replacement)

          tariff_marker = '@api_view(["GET"])\ndef tariff(request, format=None):\n'
          tariff_replacement = (
              "def _validate_tariff_query_params(query_params):\n"
              "    invalid_params = sorted(\n"
              "        set(query_params) - ALLOWED_TARIFF_QUERY_PARAMS\n"
              "    )\n"
              "    if not invalid_params:\n"
              "        return\n\n"
              "    if len(invalid_params) == 1:\n"
              '        detail = f"{invalid_params[0]} is not a valid query parameter"\n'
              "    else:\n"
              '        detail = f"{\', \'.join(invalid_params)} are not valid query parameters"\n'
              "    raise NotValid(detail)\n\n\n"
              '@api_view(["GET"])\n'
              "def tariff(request, format=None):\n"
              "    _validate_tariff_query_params(request.query_params)\n\n"
          )
          assert view_text.count(tariff_marker) == 1
          view_text = view_text.replace(tariff_marker, tariff_replacement)
          view_path.write_text(view_text)

          test_path = Path("openprescribing/frontend/tests/test_api_spending.py")
          test_text = test_path.read_text()
          class_marker = "\n\nclass TestSpending(ApiTestBase):\n"
          test_methods = (
              "\n\n"
              "    def test_tariff_rejects_unknown_query_params(self):\n"
              '        for param in ("name", "code", "unexpected"):\n'
              "            with self.subTest(param=param):\n"
              "                url = self.api_prefix\n"
              '                url += f"/tariff?format=csv&{param}=Gabapentin"\n'
              "                response = self.client.get(url, follow=True)\n\n"
              "                self.assertEqual(response.status_code, 400)\n"
              "                rows = list(\n"
              '                    csv.DictReader(response.content.decode("utf8").splitlines())\n'
              "                )\n"
              "                self.assertEqual(\n"
              '                    rows[0]["detail"],\n'
              '                    f"{param} is not a valid query parameter",\n'
              "                )\n\n"
              "    def test_tariff_sorts_multiple_unknown_query_params(self):\n"
              "        url = self.api_prefix\n"
              '        url += "/tariff?format=csv&z=1&name=Gabapentin"\n'
              "        response = self.client.get(url, follow=True)\n\n"
              "        self.assertEqual(response.status_code, 400)\n"
              "        rows = list(\n"
              '            csv.DictReader(response.content.decode("utf8").splitlines())\n'
              "        )\n"
              "        self.assertEqual(\n"
              '            rows[0]["detail"],\n'
              '            "name, z are not valid query parameters",\n'
              "        )"
          )
          assert test_text.count(class_marker) == 1
          test_path.write_text(
              test_text.replace(class_marker, test_methods + class_marker)
          )
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2

      - name: Format and lint
        run: |
          pip install -r requirements.dev.txt
          black openprescribing/api/views_spending.py \
            openprescribing/frontend/tests/test_api_spending.py
          isort openprescribing/api/views_spending.py \
            openprescribing/frontend/tests/test_api_spending.py
          scripts/lint.sh
          git diff --check

      - name: Run tariff endpoint tests
        run: |
          COMPOSE_PROJECT_NAME=op5545candidate docker compose run --rm test \
            /bin/bash -lc './scripts/docker_setup.sh && cd openprescribing && python manage.py test frontend.tests.test_api_spending.TestAPISpendingViewsTariff'

      - name: Verify broad-suite failures are credential-only
        run: |
          set +e
          output=$(TEST_SUITE=nonfunctional \
            COMPOSE_PROJECT_NAME=op5545candidate \
            docker compose run --service-ports test 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          test "$status" -ne 0
          grep -q "Found 599 test(s)." <<< "$output"
          grep -q "Ran 585 tests" <<< "$output"
          grep -q "FAILED (errors=10, skipped=62)" <<< "$output"
          test "$(grep -c 'google.auth.exceptions.DefaultCredentialsError' <<< "$output")" -eq 10
          ! grep -q "AssertionError" <<< "$output"

      - name: Production deployment check
        run: |
          COMPOSE_PROJECT_NAME=op5545candidate \
            docker compose run --rm test-production

      - name: Commit and push clean contribution
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add openprescribing/api/views_spending.py \
            openprescribing/frontend/tests/test_api_spending.py
          git commit -m "Reject invalid tariff query parameters"
          git push origin HEAD:refs/heads/fix/tariff-invalid-query-params-5545

      - name: Clean up containers
        if: always()
        run: |
          COMPOSE_PROJECT_NAME=op5545candidate docker compose down \
            --volumes --remove-orphans || true
