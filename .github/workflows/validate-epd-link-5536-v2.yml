name: Validate EPD homepage link issue 5536 v2

on:
  push:
    branches:
      - automation/validate-epd-link-5536-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2e8c7c1b5bb6feb96847ede52f4bae686bd7c368
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify audited contribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2e8c7c1b5bb6feb96847ede52f4bae686bd7c368"
          test "$(git rev-parse origin/main)" = "3fb87c3c2e42f1d410ccc2227438900e4d861a6e"
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          test "$(git diff --name-only origin/main...HEAD)" = "openprescribing/templates/index.html"
          git diff --check origin/main...HEAD

          current='https://opendata.nhsbsa.net/dataset/english-prescribing-dataset-epd-with-snomed-code'
          retired='https://opendata.nhsbsa.net/dataset/english-prescribing-data-epd'

          test "$(grep -Foc "$current" openprescribing/templates/index.html)" -eq 1
          test "$(grep -Foc "$retired" openprescribing/templates/index.html)" -eq 0

          # The FAQ's old-data answer remains outside this homepage issue.
          test "$(grep -Foc "$retired" openprescribing/templates/faq.html)" -eq 1

          # The public destination matches the dataset package used by the importer.
          grep -Fq 'package_show?id=english-prescribing-dataset-epd-with-snomed-code'             openprescribing/pipeline/management/commands/fetch_prescribing_data.py

      - name: Lint
        run: |
          pip install -r requirements.dev.txt
          scripts/lint.sh

      - name: Parse affected homepage link
        run: |
          python <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          current = "https://opendata.nhsbsa.net/dataset/english-prescribing-dataset-epd-with-snomed-code"
          retired = "https://opendata.nhsbsa.net/dataset/english-prescribing-data-epd"

          parser = LinkParser()
          parser.feed(Path("openprescribing/templates/index.html").read_text(encoding="utf-8"))

          assert parser.hrefs.count(current) == 1
          assert retired not in parser.hrefs
          PY

      - name: Confirm clean tracked state
        run: test -z "$(git status --porcelain --untracked-files=no)"
