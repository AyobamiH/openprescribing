name: Validate EPD homepage link issue 5536 v2

on:
  push:
    branches:
      - automation/validate-epd-link-5536-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/update-epd-links-5536
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify one-file contribution scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          test "$(git diff --name-only origin/main...HEAD)" = "openprescribing/templates/index.html"
          git diff --check origin/main...HEAD

          current='https://opendata.nhsbsa.net/dataset/english-prescribing-dataset-epd-with-snomed-code'
          retired='https://opendata.nhsbsa.net/dataset/english-prescribing-data-epd'

          test "$(grep -Foc "$current" openprescribing/templates/index.html)" -eq 1
          test "$(grep -Foc "$retired" openprescribing/templates/index.html)" -eq 0
          test "$(grep -Foc "$retired" openprescribing/templates/faq.html)" -eq 1
          test "$(grep -Foc "$current" openprescribing/templates/faq.html)" -eq 0

      - name: Lint
        run: |
          pip install -r requirements.dev.txt
          scripts/lint.sh

      - name: Parse affected HTML links
        run: |
          python <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          current = "https://opendata.nhsbsa.net/dataset/english-prescribing-dataset-epd-with-snomed-code"
          retired = "https://opendata.nhsbsa.net/dataset/english-prescribing-data-epd"

          index_parser = LinkParser()
          index_parser.feed(Path("openprescribing/templates/index.html").read_text(encoding="utf-8"))
          faq_parser = LinkParser()
          faq_parser.feed(Path("openprescribing/templates/faq.html").read_text(encoding="utf-8"))

          assert index_parser.hrefs.count(current) == 1
          assert retired not in index_parser.hrefs
          assert faq_parser.hrefs.count(retired) == 1
          assert current not in faq_parser.hrefs
          PY

      - name: Confirm clean tracked state
        run: test -z "$(git status --porcelain --untracked-files=no)"
